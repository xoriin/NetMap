# Blocking secret and dependency scans, plus report-only SAST while its
# existing baseline is being triaged.
name: Security scan

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday sweep for new advisories

permissions:
  contents: read

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep (community rules)
        run: semgrep scan --config auto --text backend frontend docker

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies and audit them
        run: |
          python -m pip install ./backend pip-audit
          pip-audit

  npm-deps:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-image:
    name: Container image audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/aio.Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: netmap:security-scan
          # Always rebuild from a freshly pulled base so cached OS layers cannot hide Debian fixes.
          pull: true
          no-cache: true
      - name: Block fixable high and critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: netmap:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
