# A "Release X.Y.Z" commit on test is promoted once its tests and test image pass.
# Pushes use the RELEASE_DEPLOY_KEY deploy key, which the "Protect main" ruleset lets through;
# because they are not made with the Actions token, the tag push starts the production build itself.
name: Release from test

on:
  push:
    branches:
      - test

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote release commit
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
    steps:
      - name: Require the release deploy key
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::error::RELEASE_DEPLOY_KEY secret is not set; promote by hand with scripts/promote-release.sh"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for this commit's tests and test image
        run: |
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow docker-aio.yml --commit "$SHA" --event push --json databaseId --jq '.[0].databaseId')"
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "No Docker AIO run found for $SHA"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 30

      - name: Fast-forward main and tag the release
        run: scripts/promote-release.sh "$SHA" origin
